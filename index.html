<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AntennaLab 3D | Interactive RF Radiation &amp; Propagation Lab</title>
    <meta
      name="description"
      content="Interactive 3D RF radiation pattern and propagation laboratory featuring Dipole, Collinear Omni, Yagi-Uda, Patch, Parabolic Dish, and Sectoral BTS antennas with live E/H-plane cuts and terrain shadowing."
    />
    <meta name="theme-color" content="#090D12" />
    <script>
      // Apply saved theme before first paint to prevent flash
      (function(){var t;try{t=localStorage.getItem('antennalab-theme')}catch(e){}
      if(t!=='light'&&t!=='dark')t=matchMedia('(prefers-color-scheme:light)').matches?'light':'dark';
      document.documentElement.setAttribute('data-theme',t);
      var m=document.querySelector('meta[name="theme-color"]');
      if(m)m.setAttribute('content',t==='dark'?'#090D12':'#F4F6F8');})();
    </script>
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="icon" href="/favicon.ico" type="image/x-icon" sizes="16x16 32x32 48x48 64x64 128x128 256x256" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/favicon-256.png" type="image/png" sizes="256x256" />
    <link rel="apple-touch-icon" href="/apple-icon.png" sizes="180x180" type="image/png" />
    <link rel="canonical" href="https://antenna.andresptr.site/" />
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="AntennaLab 3D | Interactive RF Radiation &amp; Propagation Lab"
    />
    <meta
      property="og:description"
      content="Inspect 3D far-field radiation lobes, E-plane and H-plane polar cuts, downtilt ground coverage heatmaps, and obstacle shadowing in real time."
    />
    <meta property="og:url" content="https://antenna.andresptr.site/" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
